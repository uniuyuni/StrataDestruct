<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strata Destruct — Beyond the Surface</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;background:#f5f7f6;color:#1c312b}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:48px 20px}.brand{letter-spacing:.16em;font-size:13px;font-weight:700;color:#4a7972}h1{font-size:clamp(27px,5vw,42px);letter-spacing:-.035em;margin:10px 0 5px}p{line-height:1.7}small,.muted{color:#617570}.panel{background:#fff;border:1px solid #dce5e0;border-radius:16px;padding:22px;margin-top:20px}textarea{width:100%;min-height:118px;background:#fff!important;color:#172c26!important;caret-color:#172c26!important;border:1px solid #9bada7;border-radius:10px;padding:14px;font:inherit;resize:vertical}textarea::placeholder{color:#687b75}button{background:#1f6255;color:#fff;border:0;padding:12px 18px;border-radius:9px;font:inherit;font-weight:650;cursor:pointer;margin-top:12px}button:disabled{opacity:.55;cursor:wait}.item{padding:14px 0;border-bottom:1px solid #e6eae7}.item:last-child{border:0}.item a{color:#155d67;font-weight:650;text-decoration:none}.tag{font-size:12px;color:#5a7268}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7f5;padding:12px;border-radius:9px;font-size:12px}.failure{color:#a13d30}.ok{color:#216c53}.hint{background:#e9f2ed;border-radius:9px;padding:12px;margin-top:10px}
</style>
</head><body><main>
<div class="brand">STRATA DESTRUCT / RESEARCH ENGINE</div>
<h1>Beyond the Surface.</h1><p class="muted">自由文から調査計画を生成し、独立した公開データから根拠候補を探す。現在はP0開発版です。</p>
<section class="panel"><label for="query"><strong>知りたいことを自由に入力</strong></label>
<textarea id="query" placeholder="例：写真の空気感を高める画像復元技術を、天文学や顕微鏡の研究も含めて探したい"></textarea>
<div><button id="search">調査を開始</button></div><p id="status" class="muted" role="status">無料APIのみ。対応キーワードの制限はありません。</p></section>
<section class="panel" id="output" hidden><h2>候補地・結論</h2><div id="assessment"></div><details><summary>調査計画を見る</summary><div id="mode" class="hint"></div><pre id="plan"></pre></details><h2>根拠資料</h2><div id="sources" class="muted"></div><div id="items"></div></section>
<footer><small>Strata Destruct v0.6.5-dev / 取得した索引は原資料の本文検証ではありません。</small></footer>
</main><script>
const q=document.querySelector('#query'),button=document.querySelector('#search'),status=document.querySelector('#status'),out=document.querySelector('#output');
function el(tag,txt,cls){const x=document.createElement(tag);if(cls)x.className=cls;x.textContent=txt;return x}
function renderAssessment(assessment){
 const as=document.querySelector('#assessment');as.replaceChildren();

 as.append(el('p',assessment?.notice??(assessment?.candidates?.length?'候補：'+assessment.candidates.length+'件。全条件の適合は未確定です。':'条件を裏付ける候補はまだ見つかっていません。取得資料を確認できます。'),'muted'));
 for(const c of assessment?.candidates??[]){
   const block=el('div','','item');block.append(el('h3',c.name+' — '+(c.status==='contradicted'?'条件不一致あり':'要確認')));
   if(c.geo)block.append(el('p',c.geo.km===null?'所在地未確認':'直線距離 約'+c.geo.km+'km（所要時間未確認）','muted'));
   if(c.route_url){const link=el('a','公共交通の経路を確認');link.href=c.route_url;link.target='_blank';link.rel='noopener noreferrer';block.append(link);}
   if(c.official_source)block.append(el('p','公園管理者・自治体の資料あり','ok'));
   for(const k of c.checks){
     block.append(el('p',k.condition+'：'+({supported:'資料に記載あり',contradicted:'不一致の記載あり',unknown:'未確認'}[k.status])+' — '+k.detail));
     for(const e of k.evidence){const a=el('a',e.title+'：'+e.quote);a.href=e.url;a.target='_blank';a.rel='noopener noreferrer';block.append(a,el('div',''));}
   }
   if(c.next_queries?.length)block.append(el('p','追加調査：'+c.next_queries.join(' / '),'muted'));
   as.append(block);
 }

}
async function run(){
 button.disabled=true;status.textContent='調査中…';out.hidden=true;
 try {
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);
 let res;try{res=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q.value,defer_assessment:true}),signal:controller.signal})}finally{clearTimeout(timer)}
 const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);
 out.hidden=false;
 document.querySelector('#mode').textContent=data.ai_status==='structured'?'地域と樹種を抽出し、個別施設を検索しました。':data.ai_status==='ok'?'AIが調査計画を作成しました':'AI解釈が使えないため、入力全文で無料検索しました。'+(data.ai_error||'');
 document.querySelector('#plan').textContent=JSON.stringify(data.plan,null,2);
 document.querySelector('#assessment').textContent='候補評価中… 取得資料は下に表示しています。';
 const src=document.querySelector('#sources');src.replaceChildren(...data.sources.map(s=>el('p',s.source+' / '+s.query+' : '+s.status+' ('+s.count+'件)'+(s.error?' — '+s.error:''),s.status==='ok'?'ok':'failure')));
 const items=document.querySelector('#items');items.replaceChildren();
 for(const item of data.records){
 const wrap=el('div','', 'item'),a=el('a',item.title);a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';wrap.append(a,el('div',item.source+' | '+item.evidence_level,'tag'),el('p',item.snippet||'要約未取得','muted'));items.append(wrap)
 }
 if(!data.records.length)items.append(el('p','取得結果は0件です。情報源ごとの状態を確認してください。','muted'));
 status.textContent=data.records.length+'件の資料候補を取得しました。候補評価中。';
 if(data.assessment?.status==='evidence_candidates'||data.assessment?.status==='no_grounded_candidates'){renderAssessment(data.assessment);}else try{
 const ac=new AbortController(),at=setTimeout(()=>ac.abort(),25000);
 let ar;try{ar=await fetch('/api/assess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:data.query,records:data.records.filter(r=>r.evidence_level==='web_excerpt')}),signal:ac.signal})}finally{clearTimeout(at)}
 const assessment=await ar.json();renderAssessment(assessment);
 }catch(e){renderAssessment({status:'error',error:e.message,candidates:[]});}
 status.textContent=data.records.length+'件の資料候補を取得しました。原資料本文は未確認です。';
 }catch(e){status.textContent='検索エラー: '+(e.name==='AbortError'?'90秒で時間切れ':e.message);status.className='failure'}
 finally{button.disabled=false}
}
button.addEventListener('click',run);
</script></body></html>
